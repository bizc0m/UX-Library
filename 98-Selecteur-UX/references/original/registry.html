<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyx Registry Console</title>
<style>
:root{--bg:#f6f3ee;--panel:#fffdf9;--ink:#161616;--muted:#6b665f;--line:#ddd6cb;--soft:#eee8df;--accent:#b11226;--green:#0d8a4a;--blue:#2463eb;--shadow:0 18px 60px rgba(32,24,16,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}button:hover{border-color:var(--accent)}.app{height:100vh;display:grid;grid-template-columns:260px 1fr 360px;grid-template-rows:46px 1fr;overflow:hidden}header{grid-column:1/4;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:rgba(255,253,249,.82);backdrop-filter:blur(16px);padding:0 14px}.brand{font-weight:800}.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 8px;color:var(--muted);background:var(--soft)}aside{border-right:1px solid var(--line);padding:14px;overflow:auto}main{padding:14px;overflow:auto}.right{border-left:1px solid var(--line);padding:14px;overflow:auto;background:rgba(255,255,255,.35)}.nav{display:flex;flex-direction:column;gap:6px}.nav button{text-align:left;border-radius:12px}.nav button.active{background:#1d1b19;color:#fff;border-color:#1d1b19}.grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 10px}label{display:grid;gap:5px;margin:9px 0;color:var(--muted);font-size:12px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:9px}textarea{min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.item b{display:block}.muted{color:var(--muted)}.ok{color:var(--green)}.warn{color:#a76500}.danger{color:var(--accent)}pre{white-space:pre-wrap;background:#191715;color:#f8f0e6;border-radius:14px;padding:12px;max-height:280px;overflow:auto}.tabbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabbar button.active{background:var(--accent);border-color:var(--accent);color:white}.automation li{margin:8px 0}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:3px 7px;background:#fff;font-size:12px;margin:2px}@media(max-width:1100px){.app{grid-template-columns:220px 1fr;grid-template-rows:46px 1fr 320px}header{grid-column:1/3}.right{grid-column:1/3;border-left:0;border-top:1px solid var(--line)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><span class="brand">Nyx Registry Console</span><span class="pill">local v0</span><span class="pill" id="saveState">autosave prêt</span><span style="flex:1"></span><button id="exportJson">Exporter JSON</button><button id="copyPrompt">Copier prompt NeuroForge</button></header>
<aside><div class="nav" id="nav"></div></aside>
<main><h1 id="mainTitle">Produit</h1><div id="view"></div></main>
<section class="right"><h3>Automatisation</h3><ol class="automation" id="steps"></ol><h3>Plan généré</h3><pre id="plan-json"></pre><h3>Contrôles</h3><div class="list" id="checks"></div></section>
</div>
<script>
const initial={"blades.yml": "version: 0\nblade_contract:\n  required:\n    - id\n    - name\n    - module\n    - expertise\n    - permissions\n    - actions\n    - inputs\n    - outputs\n    - ui_panel\n    - tests\n    - standalone_mode\nblades:\n  documents:\n    module: documents\n    expertise: markdown_txt_documents\n    standalone_mode: possible\n  web_research:\n    module: web\n    expertise: web_pages_sources\n    standalone_mode: possible\n  terminal:\n    module: terminal\n    expertise: shell_logs_commands\n    standalone_mode: possible_macos_first\n  neuroforge_comms:\n    module: communication\n    expertise: product_communication_launch\n    standalone_mode: possible\n  white_label_factory:\n    module: white_label\n    expertise: client_brandable_package\n    standalone_mode: possible\n", "combos.yml": "version: 0\ncombo_contract:\n  required:\n    - id\n    - objective\n    - rack\n    - sequence\n    - validation\n    - rollback\ncombos:\n  public_repo_launch:\n    objective: prepare_clean_public_repo_launch\n    rack: launch\n    sequence: [inventory, sanitize, readme, topics, launch_drafts, verify]\n    validation: draft_review_required\n  writing_workspace:\n    objective: produce_structured_markdown_work\n    rack: writing\n    sequence: [open_docs, split_workspace, add_sources, chapter_tabs, export]\n    validation: document_visible_and_saved\n  client_white_label:\n    objective: package_client_brandable_version\n    rack: launch\n    sequence: [select_manifest, apply_skin, sanitize, build, verify]\n    validation: no_private_source_leak\n", "exports.yml": "version: 0\nexport_contract:\n  required:\n    - product\n    - target_repo\n    - visibility\n    - include\n    - exclude\n    - skin\n    - tests\n    - communication\nexports:\n  nyx_studio_public:\n    target_repo: bizc0m/nyx-studio\n    visibility: public\n    include: [nyx_kernel_public, documents, web, selected_racks, public_skins]\n    exclude: [mistress_source, private_prompts, premium_logic, client_data, local_paths, secrets]\n    skin: nyx_glass\n    communication: public_launch\n  client_template:\n    target_repo: client/nyx-client-template\n    visibility: private_client\n    include: [nyx_kernel_client, selected_modules, selected_blades, selected_racks]\n    exclude: [mistress_source, unrelated_clients, private_prompts]\n    skin: client_white_label\n    communication: client_docs\n  internal_mistress:\n    target_repo: private/mistress\n    visibility: private\n    include: [all_source, rd, experiments, prompts, premium_logic]\n    exclude: []\n    skin: internal\n    communication: none\n", "metis.yml": "version: 0\nname: Metis\nscope:\n  - renseignement_transversal\n  - signal_collection\n  - source_linking\n  - risk_analysis\n  - public_private_arbitrage\n  - premium_client_arbitrage\ninputs:\n  - registry\n  - git_state\n  - chats\n  - docs\n  - runtime_evidence\n  - publication_rules\noutputs:\n  - global_context\n  - risks\n  - decisions\n  - next_actions\n  - validation_matrix\nguards:\n  mark_unverified_relations: true\n  require_source_for_claims: true\n  block_private_leakage: true\n", "modules.yml": "version: 0\nmodules:\n  documents:\n    type: metier\n    status: prototype_validated_partial\n    provides: [markdown, text, frontmatter, tags, chapters]\n  web:\n    type: transversal\n    status: planned\n    provides: [webview, page_capture, source_context]\n  terminal:\n    type: transversal\n    status: planned\n    provides: [pty, shell_sessions, logs]\n  communication:\n    type: transversal\n    status: planned\n    provides: [readme, posts, github_topics, launch_drafts]\n  white_label:\n    type: transversal\n    status: planned\n    provides: [skins, manifests, packaging]\n  km:\n    type: metier\n    status: planned\n    provides: [sources, tags, graph, duplicates]\n  noteplan:\n    type: metier\n    status: planned\n    provides: [noteplan_docs, controlled_write, rollback]\n", "neuroforge.yml": "version: 0\nname: NeuroForge\nscope:\n  - creation_from_chats\n  - rollout\n  - documents\n  - pages\n  - badges\n  - communication\n  - export_control\ninputs:\n  - chat_history\n  - repo_state\n  - project_registry\n  - product_manifest\n  - source_files\noutputs:\n  - decisions\n  - specs\n  - readme\n  - about\n  - security\n  - contributing\n  - release_notes\n  - project_page\n  - badges\n  - github_topics\n  - launch_drafts\npipeline:\n  - inventory\n  - rule_check\n  - draft\n  - approve\n  - run\n  - verify\n  - publish\n  - finish\nguards:\n  no_external_post_without_approval: true\n  no_main_push_without_explicit_scope: true\n  no_private_inventory_on_public_pages: true\n  distinguish_docs_from_runtime: true\n", "nyx.yml": "version: 0\nname: Nyx\nscope:\n  - framework_complet\nkernel:\n  - window_manager\n  - pane_engine\n  - tab_engine\n  - layout_persistence\n  - drag_drop\n  - permissions\n  - theme_engine\n  - skin_engine\n  - registry_loader\n  - build_export\nsurfaces:\n  - macos_app\n  - web_prototype\n  - standalone_blade_app\nfirst_vertical_slice:\n  - explorer\n  - documents\n  - panes_tabs\n  - persistence\n  - web_pane\n  - terminal_pane\n  - communication_panel\nguards:\n  prototype_is_not_runtime: true\n  verify_visible_ui: true\n  preserve_existing_branches: true\n", "racks.yml": "version: 0\nrack_contract:\n  required:\n    - id\n    - name\n    - blades\n    - layout\n    - shared_context\n    - permissions\n    - combos\nracks:\n  writing:\n    blades: [documents, web_research, neuroforge_comms]\n    layout: left_docs_right_web_bottom_comms\n  launch:\n    blades: [neuroforge_comms, web_research, white_label_factory]\n    layout: comms_primary_support_panels\n  ops:\n    blades: [terminal, documents, web_research]\n    layout: terminal_primary_docs_side\n  km:\n    blades: [documents, web_research]\n    layout: sources_notes_graph_ready\n", "skins.yml": "version: 0\nskin_contract:\n  required:\n    - id\n    - product_name\n    - logo\n    - palette\n    - typography\n    - icons\n    - wording\n    - density\nskins:\n  notecortex_light:\n    status: prototype_reference\n    palette: light_clean\n  iterm_dark:\n    status: planned\n    palette: dark_terminal\n  nyx_glass:\n    status: planned\n    palette: glass_dashboard\n  client_white_label:\n    status: manifest_driven\n    palette: client_defined\nrules:\n  skin_does_not_modify_business_code: true\n", "vocabulary.yml": "version: 0\nterms:\n  Mistress:\n    role: source_privee_rd\n    public: false\n  NeuroForge:\n    role: intelligence_creation_rollout\n    public: partial\n  Metis:\n    role: renseignement_transversal_arbitrage\n    public: partial\n  Nyx:\n    role: framework_complet\n    public: partial\n  Module:\n    role: expertise_metier_ou_transversale\n    public: selective\n  Blade:\n    role: fonction_experte\n    public: selective\n  Rack:\n    role: groupe_blades_equipe\n    public: selective\n  Combo:\n    role: combinaison_resultat\n    public: selective\n  Skin:\n    role: identite_graphique_branding\n    public: true\n  Export:\n    role: version_epuree_publique_client_premium_internal\n    public: true\nrules:\n  preserve_user_terms: true\n  do_not_rename_without_explicit_request: true\n  do_not_publish_private_source: true\n"};
const LS='nyx-registry-console-v0';
const state=JSON.parse(localStorage.getItem(LS)||'null')||{files:initial,product:{name:'Nyx Studio',visibility:'public',skin:'notecortex_light',rack:'writing'},enabled:{modules:['documents','web','communication'],blades:['documents','web_research','neuroforge_comms'],racks:['writing'],combos:['public_repo_launch']}};
const sections=[['product','Produit'],['modules','Modules'],['blades','Blades'],['racks','Racks'],['combos','Combos'],['skins','Skins'],['exports','Exports'],['raw','YAML brut']];let active='product';
function save(){localStorage.setItem(LS,JSON.stringify(state));document.getElementById('saveState').textContent='autosave '+new Date().toLocaleTimeString('fr-FR')}
function btn(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}
function field(label,key,options){const l=document.createElement('label');l.textContent=label;let el=options?document.createElement('select'):document.createElement('input');el.id='product-'+key;if(options)options.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;el.append(op)});el.value=state.product[key]||'';el.oninput=()=>{state.product[key]=el.value;save();renderSide()};l.append(el);return l}
function parseIds(file){return (state.files[file]||'').split('\n').map(line=>{const m=line.match(/^  ([a-zA-Z0-9_-]+):$/);return m?m[1]:null}).filter(Boolean)}
function toggle(kind,id){const arr=state.enabled[kind];const i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);save();render()}
function renderNav(){const n=document.getElementById('nav');n.replaceChildren(...sections.map(([id,label])=>btn(label,()=>{active=id;render()},id===active?'active':'')))}
function cards(kind,file,title){const ids=parseIds(file);const d=document.createElement('div');d.className='card';d.innerHTML='<h2>'+title+'</h2><p class="muted">Activer uniquement ce qui doit sortir dans le produit.</p>';const list=document.createElement('div');list.className='list';ids.forEach(id=>{const on=state.enabled[kind].includes(id);const item=document.createElement('div');item.className='item';item.innerHTML='<b>'+id+'</b><span class="muted">'+(on?'inclus':'exclu')+'</span>';item.append(btn(on?'Retirer':'Inclure',()=>toggle(kind,id)));list.append(item)});d.append(list);return d}
function rawEditor(){const box=document.createElement('div');box.className='grid';Object.keys(state.files).sort().forEach(name=>{const c=document.createElement('div');c.className='card';c.innerHTML='<h3>'+name+'</h3>';const ta=document.createElement('textarea');ta.className='raw-editor';ta.value=state.files[name];ta.oninput=()=>{state.files[name]=ta.value;save();renderSide()};c.append(ta);box.append(c)});return box}
function productView(){const d=document.createElement('div');d.className='grid';const c=document.createElement('div');c.className='card';c.innerHTML='<h2>Générateur marque blanche</h2>';c.append(field('Nom produit','name'),field('Visibilité','visibility',['public','private_client','premium','internal']),field('Skin','skin',parseIds('skins.yml')),field('Rack de départ','rack',parseIds('racks.yml')));const c2=document.createElement('div');c2.className='card';c2.innerHTML='<h2>Sortie automatique</h2><p>Le manifest choisit quoi inclure, quoi exclure, quel skin appliquer et quelle communication générer.</p>';c2.append(btn('Préparer export',()=>{active='exports';render()}),btn('Préparer communication',()=>{state.enabled.modules.push('communication');state.enabled.modules=[...new Set(state.enabled.modules)];save();renderSide()}));d.append(c,c2);return d}
function render(){renderNav();const v=document.getElementById('view');const current=sections.find(([id])=>id===active);document.getElementById('mainTitle').textContent=current?current[1]:'Produit';v.replaceChildren();if(active==='product')v.append(productView());if(active==='modules')v.append(cards('modules','modules.yml','Modules'));if(active==='blades')v.append(cards('blades','blades.yml','Blades expertes'));if(active==='racks')v.append(cards('racks','racks.yml','Racks'));if(active==='combos')v.append(cards('combos','combos.yml','Combos'));if(active==='skins')v.append(cards('skins','skins.yml','Skins'));if(active==='exports')v.append(cards('combos','exports.yml','Exports'));if(active==='raw')v.append(rawEditor());renderSide()}
function renderSide(){document.getElementById('steps').innerHTML=['Lire Mistress source','NeuroForge inventorie','Mètis arbitre public/privé','Nyx compose rack + blades','Sanitize export','Build package','Générer README/pages/badges/posts','Review humaine','Publish'].map(x=>'<li>'+x+'</li>').join('');const plan={product:state.product,include:state.enabled,exclude:['private_prompts','secrets','local_paths','client_data','premium_logic_non_autorisee'],checks:['registry présent','autosave localStorage','manifest export','review avant publication']};document.getElementById('plan-json').textContent=JSON.stringify(plan,null,2);const checks=document.getElementById('checks');checks.replaceChildren();[['Modules',state.enabled.modules.length],['Blades',state.enabled.blades.length],['Racks',state.enabled.racks.length],['Combos',state.enabled.combos.length]].forEach(([k,v])=>{const div=document.createElement('div');div.className='item';div.innerHTML='<b>'+k+'</b><span class="'+(v?'ok':'warn')+'">'+v+' sélectionné(s)</span>';checks.append(div)})}
document.getElementById('exportJson').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nyx-registry-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('copyPrompt').onclick=async()=>{const prompt='Utilise ce registry pour préparer un export propre. Produit: '+state.product.name+'; modules: '+state.enabled.modules.join(', ')+'; blades: '+state.enabled.blades.join(', ')+'. Génère seulement des brouillons et demande validation avant publication.';await navigator.clipboard.writeText(prompt);document.getElementById('saveState').textContent='prompt copié'};
render();
</script>
</body>
</html>
