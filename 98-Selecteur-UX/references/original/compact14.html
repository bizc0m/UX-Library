  <script type="__bundler/template">"<!DOCTYPE html>\n<!--\nv1.4 2026-09-07 STABLE-INTERNE\nDEMANDE: on continue (passe 2 de compaction, suite a \"je veux du tres compact\")\nSORTIE: 2e resserrement sur toute la densite — header 32px->28px, tab bar 26px->22px, pane header 28px->24px, sidebar gap 10px->6px + largeur 210px->170px, paddings/gaps items -1 a -2px supplementaires, tailles police -1px (base 11px), icones -1px. Aucun changement de logique/structure (React/dc-script intact), uniquement valeurs CSS inline.\nPREUVE: rendu local via http.server + Browser pane, capture ecran — toute la sidebar (Cockpit a Note/Dossier, sections Tags incluses) tient desormais sans scroll, aucun chevauchement/troncature de texte constate.\nFichier precedent: Nyx Dashboard Mockup_v1.2.dc.html\n-->\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"57adf3de-849f-4eb3-940d-0992c1d78f16\"><\/script>\n<\/head>\n<body>\n<x-dc>\n\n<helmet>\n<script src=\"e5396e89-0670-4856-be62-60424ec4aefd\"><\/script>\n<style>\n  @keyframes nyx-pulse { 0%,100%{opacity:1} 50%{opacity:.55} }\n<\/style>\n<\/helmet>\n\n<div style=\"--ink-0:#07070B;--ink-1:#0F0F15;--ink-2:#16161E;--ink-3:#1F1F2A;--ink-4:#2C2C3A;--bone-0:#F2F2F5;--bone-1:#B8B8BE;--bone-2:#8E8E93;--bone-3:#545458;--sel-blue:#409CFF;--ic-blue:#0A84FF;--ic-red:#FF453A;--ic-teal:#64D2FF;--ic-orange:#FF9F0A;--ic-green:#30D158;--ic-purple:#BF5AF2;--font-display:-apple-system,'SF Pro Display',system-ui,sans-serif;--font-body:-apple-system,'SF Pro Text',system-ui,sans-serif;--font-mono:ui-monospace,'SF Mono',monospace; width:100%; height:100vh; background:var(--ink-0); color:var(--bone-0); font-family:var(--font-body); display:flex; flex-direction:column; overflow:hidden; font-size:11px;\">\n\n  <!-- title bar + toolbar fusionnés sur une seule ligne, façon NotePlan -->\n  <div style=\"height:28px; flex:none; display:flex; align-items:center; gap:5px; padding:0 6px; background:var(--ink-1); border-bottom:1px solid var(--ink-4);\">\n    <div style=\"display:flex; gap:8px;\">\n      \n      \n      \n    <\/div>\n    <span onClick=\"{{ toggleSidebar }}\" title=\"Plier / déplier la colonne\" style=\"display:flex; cursor:pointer;\"><i data-lucide=\"panel-left\" style=\"width:12px;height:12px;color:var(--bone-2); pointer-events:none;\"><\/i><\/span>\n    <div style=\"font-weight:600; font-size:11px;\">Nyx<\/div>\n    <div style=\"color:var(--bone-3);\">/<\/div>\n    <div style=\"color:var(--bone-2); font-size:10px; white-space:nowrap;\">Dashboard composable<\/div>\n    <div style=\"width:1px;height:12px;background:var(--ink-4); flex:none;\"><\/div>\n    <div style=\"display:flex; align-items:center; gap:2px; background:var(--ink-2); border:1px solid var(--ink-4); border-radius:6px; padding:2px; flex:none;\">\n      <div onClick=\"{{ splitFocusedV }}\" title=\"Split vertical (⌘D)\" style=\"width:17px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;\"><i data-lucide=\"columns-2\" style=\"width:10px;height:10px;color:var(--bone-1); pointer-events:none;\"><\/i><\/div>\n      <div onClick=\"{{ splitFocusedH }}\" title=\"Split horizontal (⌘⇧D)\" style=\"width:17px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;\"><i data-lucide=\"rows-2\" style=\"width:10px;height:10px;color:var(--bone-1); pointer-events:none;\"><\/i><\/div>\n    <\/div>\n    <div style=\"display:flex;align-items:center;gap:5px;color:var(--bone-1);font-size:10px;padding:2px 5px;border:1px solid var(--ink-4);border-radius:6px; flex:none;\">\n      <i data-lucide=\"filter\" style=\"width:9px;height:9px;color:var(--bone-2);\"><\/i>Filtres\n    <\/div>\n    <div style=\"flex:1; min-width:12px;\"><\/div>\n    <div style=\"display:flex;align-items:center;gap:6px;background:var(--ink-2);border:1px solid var(--ink-4);border-radius:6px;padding:2px 6px;color:var(--bone-2);font-size:10px;width:130px; flex:none;\">\n      <i data-lucide=\"search\" style=\"width:9px;height:9px;\"><\/i>Rechercher…\n    <\/div>\n    <div onClick=\"{{ splitFocusedV }}\" style=\"display:flex;align-items:center;gap:5px;background:var(--ink-2);border:1px solid var(--ink-4);color:var(--bone-1);font-size:10px;padding:3px 6px;border-radius:6px;cursor:pointer; flex:none;\">\n      <i data-lucide=\"split-square-horizontal\" style=\"width:9px;height:9px; pointer-events:none;\"><\/i>+ pane\n    <\/div>\n    <div style=\"color:var(--bone-3);font-size:9px;font-family:var(--font-mono); white-space:nowrap; flex:none;\">{{ paneCount }} panes<\/div>\n    <div style=\"display:flex; align-items:center; gap:3px; color:var(--bone-1); font-size:11px; flex:none;\">\n      <span style=\"width:4px;height:4px;border-radius:999px;background:var(--ic-green);animation:nyx-pulse 2s ease-in-out infinite;\"><\/span>\n      <span style=\"font-family:var(--font-mono); font-variant-numeric:tabular-nums;\">09:33 CET<\/span>\n    <\/div>\n    <i data-lucide=\"settings\" style=\"width:11px;height:11px;color:var(--bone-2); flex:none;\"><\/i>\n  <\/div>\n\n  <!-- tab bar : onglets déplaçables (drag pour réordonner) -->\n  <div style=\"height:22px; flex:none; display:flex; align-items:center; gap:2px; padding:0 5px; background:var(--ink-1); border-bottom:1px solid var(--ink-4); overflow-x:auto;\">\n    <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"6\">\n      <div draggable=\"true\" onDragStart=\"{{ tab.onDragStart }}\" onDragOver=\"{{ tab.onDragOver }}\" onDrop=\"{{ tab.onDrop }}\" onClick=\"{{ tab.onClick }}\" style=\"display:flex; align-items:center; gap:6px; padding:2px 5px 2px 6px; border-radius:6px; font-size:10px; cursor:grab; color: {{ tab.textColor }}; background: {{ tab.bg }}; border-bottom: {{ tab.borderBottom }};\">\n        <span>{{ tab.label }}<\/span>\n        <span onClick=\"{{ tab.onClose }}\" title=\"Fermer l'onglet\" style=\"display:flex; cursor:pointer; border-radius:4px; padding:0px;\"><i data-lucide=\"x\" style=\"width:9px;height:9px; pointer-events:none;\"><\/i><\/span>\n      <\/div>\n    <\/sc-for>\n    <span onClick=\"{{ addTab }}\" title=\"Nouvel onglet\" style=\"display:flex; align-items:center; justify-content:center; width:16px;height:16px; border-radius:6px; cursor:pointer; flex:none;\"><i data-lucide=\"plus\" style=\"width:11px;height:11px;color:var(--bone-3); pointer-events:none;\"><\/i><\/span>\n  <\/div>\n\n  <!-- body -->\n  <div style=\"flex:1; display:flex; min-height:0;\">\n\n    <!-- sidebar : pliable / dépliable -->\n    <div style=\"width: {{ sidebarWidth }}; flex:none; background:var(--ink-1); border-right: {{ sidebarBorder }}; overflow-x:hidden; overflow-y:auto; padding: {{ sidebarPadding }}; display:flex; flex-direction:column; gap:6px; transition: width 180ms ease, padding 180ms ease;\">\n      <div style=\"width:170px; display:flex; flex-direction:column; gap:6px;\">\n\n      <div style=\"display:flex; align-items:center; gap:5px; background:var(--ink-2); border:1px solid var(--ink-4); border-radius:6px; padding:4px 6px; color:var(--bone-2); font-size:10px;\">\n        <i data-lucide=\"search\" style=\"width:10px;height:10px;\"><\/i>Recherche\n      <\/div>\n\n      <div style=\"display:flex; flex-direction:column; gap:2px;\">\n        <div onClick=\"{{ sections.cockpit.onToggle }}\" style=\"display:flex; align-items:center; gap:3px; padding:0 5px 3px; cursor:pointer;\">\n          <i data-lucide=\"{{ sections.cockpit.icon }}\" style=\"width:9px;height:9px;color:var(--bone-3); pointer-events:none;\"><\/i>\n          <span style=\"font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:var(--bone-3);\">Cockpit<\/span>\n        <\/div>\n        <sc-if value=\"{{ sections.cockpit.open }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-for list=\"{{ cockpitItems }}\" as=\"it\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex; align-items:center; gap:5px; padding:3px 5px
