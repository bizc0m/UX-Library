<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>K-Hair — dashboard prospection</title>
<style>
:root {
  --ground: #0c1116; --surface: #141b23; --surface-raised: #1c2530;
  --line: #2a3441; --ink: #e8ecf1; --ink-dim: #8996a6;
  --accent: #4fb3a9; --accent-2: #d99a5b; --danger: #d9776f;
  --font-body: -apple-system, "Segoe UI", sans-serif;
  --font-mono: "SF Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin:0; background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 13px; padding: 20px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.subtitle { color: var(--ink-dim); margin: 0 0 16px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.controls select, .controls input {
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  font-family: var(--font-body); font-size: 13px; padding: 6px 10px; border-radius: 6px;
}
.controls input[type=text] { min-width: 220px; }
.count { color: var(--ink-dim); margin-left: auto; font-family: var(--font-mono); font-size: 12px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-raised); cursor: pointer; user-select: none; white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-dim); position: sticky; top: 0; }
th:hover { color: var(--ink); }
th.sorted::after { content: " ▾"; }
th.sorted.asc::after { content: " ▴"; }
tr:hover td { background: var(--surface-raised); }
td.nom { font-weight: 600; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-family: var(--font-mono); }
.p1 { background: rgba(217,119,111,0.25); color: var(--danger); }
.p2 { background: rgba(217,154,91,0.25); color: var(--accent-2); }
.p3 { background: rgba(255,255,255,0.08); color: var(--ink-dim); }
.statut-confirme { color: var(--accent); }
.statut-probable { color: var(--accent-2); }
.statut-nonverifie { color: var(--ink-dim); }
a { color: var(--accent); }
.wrap-table { overflow-x: auto; max-height: 82vh; overflow-y: auto; }
</style></head>
<body>
<h1>K-Hair — base de prospection consolidée</h1>
<p class="subtitle">299 cibles (influenceurs, salons, marques, distributeurs, événements, institutions) — Séoul + Suisse. Source : Master K-Hair (xlsx).</p>

</table></div>

let sortKey = "Score", sortAsc = false;
let filtered = DATA;

function statutClass(s) {
  if (s === "CONFIRMÉ") return "statut-confirme";
  if (s === "PROBABLE") return "statut-probable";
  return "statut-nonverifie";
}
function prioClass(p) { return (p || "").toLowerCase(); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function statutSimple(s) {
  s = (s || "").trim().toUpperCase();
  if (s.startsWith("CONFIRMÉ")) return "CONFIRMÉ";
  if (s.startsWith("PROBABLE")) return "PROBABLE";
  if (s.startsWith("NON VÉRIFIÉ")) return "NON VÉRIFIÉ";
  return s || "?";
}
DATA.forEach(r => r._statut_simple = statutSimple(r["Statut"]));

function scoreNum(v) { const m = String(v||"").match(/([\d.]+)/); return m ? parseFloat(m[1]) : -1; }

function render() {
  const tbody = document.getElementById("tbody");
  const rows = [...filtered].sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (sortKey === "Score") { va = scoreNum(va); vb = scoreNum(vb); }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${esc(r["Type"])}</td>
      <td class="nom">${esc(r["Nom"])}</td>
      <td>${esc(r["Pays"])}</td>
      <td>${esc(r["Ville"])}</td>
      <td>${esc(r["Positionnement"])}</td>
      <td>${esc(r["Score"])}</td>
      <td><span class="badge ${prioClass(r["Priorité"])}">${esc(r["Priorité"])}</span></td>
      <td class="${statutClass(r._statut_simple)}">${esc(r["Statut"])}</td>
      <td>${esc(r["Contact complet"])} ${r["Email"] ? "· " + esc(r["Email"]) : ""}</td>
      <td>${esc(r["Prochaine action"])}</td>
      <td>${r["Source"] ? `<a href="${esc(r["Source"])}" target="_blank">lien ↗</a>` : ""}</td>
    </tr>`).join("");
  document.getElementById("count").textContent = rows.length + " / " + DATA.length;
}

function applyFilters() {
  const type = document.getElementById("f-type").value;
  const prio = document.getElementById("f-prio").value;
  const statut = document.getElementById("f-statut").value;
  const q = document.getElementById("f-search").value.trim().toLowerCase();
  filtered = DATA.filter(r => {
    if (type && r["Type"] !== type) return false;
    if (prio && r["Priorité"] !== prio) return false;
    if (statut && r._statut_simple !== statut) return false;
    if (q) {
      const hay = [r["Nom"], r["Ville"], r["Pays"], r["Positionnement"]].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  render();
}

document.querySelectorAll("th[data-k]").forEach(th => {
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = false; }
    document.querySelectorAll("th").forEach(t => t.classList.remove("sorted", "asc"));
    th.classList.add("sorted"); if (sortAsc) th.classList.add("asc");
    render();
  });
});
["f-type", "f-prio", "f-statut"].forEach(id => document.getElementById(id).addEventListener("change", applyFilters));
document.getElementById("f-search").addEventListener("input", applyFilters);

applyFilters();
</script>
