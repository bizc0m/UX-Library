<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MadameGlitch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      overflow: hidden;
    }
    #selector {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      background: #050505;
      z-index: 100;
    }
    h1 {
      font-size: 48px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    h1 span { color: #ff2a6d; }
    .subtitle { color: #888; font-size: 14px; letter-spacing: 2px; }
    .modes {
      display: flex;
      gap: 24px;
      margin-top: 20px;
    }
    .mode-card {
      width: 220px;
      height: 280px;
      background: #111;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-card:hover {
      border-color: #ff2a6d;
      transform: translateY(-6px);
      box-shadow: 0 20px 50px rgba(255,42,109,0.15);
    }
    .mode-card .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 28px;
      background: linear-gradient(135deg, #ff2a6d, #05d9e8);
      color: #000;
    }
    .mode-card h2 { font-size: 22px; }
    .mode-card p { font-size: 12px; color: #888; text-align: center; padding: 0 20px; }
  </style>
</head>
<body>
  <div id="selector">
    <h1>Madame<span>Glitch</span></h1>
    <div class="subtitle">Choisis ton mode</div>

    <div class="modes">
      <div class="mode-card" data-mode="boumboum">
        <div class="icon">🎉</div>
        <h2>Boum Boum</h2>
        <p>Mode perform party avec effets audio-réactifs et DemoForge ANSI</p>
      </div>
      <div class="mode-card" data-mode="live">
        <div class="icon">📹</div>
        <h2>Live</h2>
        <p>Mode VJ/stream avec caméra, micro et enregistrement</p>
      </div>
    </div>
  </div>

  <script type="module">
    import * as boumboum from './modules/boumboum.js';
    import * as live from './modules/live.js';

    const selector = document.getElementById('selector');

    document.querySelectorAll('.mode-card').forEach(card => {
      card.addEventListener('click', async () => {
        const mode = card.dataset.mode;
        selector.style.display = 'none';
        if (mode === 'boumboum') await boumboum.start(document.body);
        if (mode === 'live') await live.start(document.body);
      });
    });
  </script>
</body>
</html>
