<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MadameGlitch PRO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #050505;
      --panel: #111;
      --panel-2: #1a1a1a;
      --accent: #ff2a6d;
      --accent-2: #05d9e8;
      --text: #eee;
      --muted: #888;
      --radius: 12px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    canvas { display: block; }

    /* HUD */
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    #hud > * { pointer-events: auto; }
    #brand {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.08);
    }
    #brand .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 6px;
      display: grid; place-items: center;
      font-weight: 800; font-size: 14px; color: #000;
    }
    #brand h1 { font-size: 16px; letter-spacing: 0.5px; }
    #brand span { color: var(--accent); }

    #controls {
      display: flex;
      gap: 8px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      padding: 8px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn {
      background: var(--panel-2);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn:hover { background: #262626; border-color: rgba(255,255,255,0.18); }
    .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Webcam PIP */
    #cam-pip {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 240px;
      height: 180px;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
      display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    #cam-pip video {
      width: 100%; height: 100%; object-fit: cover;
    }
    #cam-pip.visible { display: block; }

    /* Audio meter */
    #audio-meter {
      position: fixed;
      bottom: 16px;
      left: 16px;
      width: 200px;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      z-index: 10;
      display: none;
    }
    #audio-meter.visible { display: block; }
    #audio-meter .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      transition: width 0.05s linear;
    }

    /* Status */
    #status {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.08);
    }
    #status.recording { color: var(--accent); border-color: var(--accent); }

    /* Loading */
    #loading {
      position: fixed;
      inset: 0;
      display: grid; place-items: center;
      background: var(--bg);
      z-index: 100;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 1px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loading">CHARGEMENT MADAMEGLITCH PRO…</div>

  <div id="canvas-container"></div>

  <div id="hud">
    <div id="brand">
      <div class="logo">M</div>
      <h1>MadameGlitch <span>PRO</span></h1>
    </div>
    <div id="controls">
      <button class="btn" id="btn-cam">Caméra</button>
      <button class="btn" id="btn-audio">Micro</button>
      <button class="btn" id="btn-record">Enregistrer</button>
      <button class="btn" id="btn-shot">Capture</button>
      <button class="btn" id="btn-fs">Plein écran</button>
    </div>
  </div>

  <div id="cam-pip"><video id="cam-video" autoplay playsinline muted></video></div>
  <div id="audio-meter"><div class="bar" id="audio-bar"></div></div>
  <div id="status">Prêt</div>

  <script>
    (async function() {
      const THREE = await import('./assets/three.module.js');

      // DOM
      const container = document.getElementById('canvas-container');
      const loading = document.getElementById('loading');
      const btnCam = document.getElementById('btn-cam');
      const btnAudio = document.getElementById('btn-audio');
      const btnRecord = document.getElementById('btn-record');
      const btnShot = document.getElementById('btn-shot');
      const btnFs = document.getElementById('btn-fs');
      const camPip = document.getElementById('cam-pip');
      const camVideo = document.getElementById('cam-video');
      const audioMeter = document.getElementById('audio-meter');
      const audioBar = document.getElementById('audio-bar');
      const status = document.getElementById('status');

      // Three.js scene
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 1;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Plasma shader
      const geometry = new THREE.PlaneGeometry(2, 2);
      const material = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
          uAudio: { value: 0 }
        },
        vertexShader: `
          void main() { gl_Position = vec4(position, 1.0); }
        `,
        fragmentShader: `
          precision mediump float;
          uniform float uTime;
          uniform vec2 uResolution;
          uniform float uAudio;

          float rand(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
          }

          void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / min(uResolution.x, uResolution.y);
            float t = uTime * 0.5;
            float audioBoost = 1.0 + uAudio * 2.0;

            float v1 = sin(uv.x * 3.0 * audioBoost + t);
            float v2 = sin(uv.y * 4.0 * audioBoost + t * 1.2);
            float v3 = sin((uv.x + uv.y) * 2.0 * audioBoost + t * 0.7);

            float plasma = v1 + v2 + v3;
            plasma = sin(plasma * 1.5 + t) * 0.5 + 0.5;

            vec3 col = vec3(
              0.5 + 0.5 * sin(plasma * 6.28 + 0.0),
              0.5 + 0.5 * sin(plasma * 6.28 + 2.0),
              0.5 + 0.5 * sin(plasma * 6.28 + 4.0)
            );

            // scanlines
            float scan = sin(gl_FragCoord.y * 0.7) * 0.04;
            col -= scan;

            // grain
            col += rand(uv + uTime) * 0.05;

            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      scene.add(new THREE.Mesh(geometry, material));

      // Webcam
      let camStream = null;
      btnCam.addEventListener('click', async () => {
        if (camStream) {
          camStream.getTracks().forEach(t => t.stop());
          camStream = null;
          camVideo.srcObject = null;
          camPip.classList.remove('visible');
          btnCam.classList.remove('active');
          return;
        }
        try {
          camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          camVideo.srcObject = camStream;
          camPip.classList.add('visible');
          btnCam.classList.add('active');
        } catch (e) {
          alert('Caméra refusée ou indisponible');
        }
      });

      // Audio
      let audioCtx, analyser, audioData, audioLoop;
      btnAudio.addEventListener('click', async () => {
        if (audioCtx) {
          audioCtx.close();
          audioCtx = null;
          audioMeter.classList.remove('visible');
          btnAudio.classList.remove('active');
          cancelAnimationFrame(audioLoop);
          return;
        }
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const src = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          src.connect(analyser);
          audioData = new Uint8Array(analyser.frequencyBinCount);
          audioMeter.classList.add('visible');
          btnAudio.classList.add('active');

          function updateAudio() {
            if (!analyser) return;
            analyser.getByteFrequencyData(audioData);
            let sum = 0;
            for (let v of audioData) sum += v;
            const avg = sum / audioData.length / 255;
            audioBar.style.width = `${avg * 100}%`;
            material.uniforms.uAudio.value = avg;
            audioLoop = requestAnimationFrame(updateAudio);
          }
          updateAudio();
        } catch (e) {
          alert('Micro refusé ou indisponible');
        }
      });

      // Record
      let mediaRecorder, recordedChunks = [];
      btnRecord.addEventListener('click', () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
          return;
        }
        const canvas = renderer.domElement;
        const stream = canvas.captureStream(30);
        if (camStream) {
          const audioTracks = camStream.getAudioTracks();
          audioTracks.forEach(t => stream.addTrack(t));
        }
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        recordedChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `madameglitch_${Date.now()}.webm`;
          a.click();
          URL.revokeObjectURL(url);
          status.textContent = 'Prêt';
          status.classList.remove('recording');
          btnRecord.classList.remove('active');
          btnRecord.textContent = 'Enregistrer';
        };
        mediaRecorder.start();
        status.textContent = '● Enregistrement…';
        status.classList.add('recording');
        btnRecord.classList.add('active');
        btnRecord.textContent = 'Stop';
      });

      // Screenshot
      btnShot.addEventListener('click', () => {
        const canvas = renderer.domElement;
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `madameglitch_shot_${Date.now()}.png`;
        a.click();
        status.textContent = 'Capture sauvegardée';
        setTimeout(() => status.textContent = 'Prêt', 2000);
      });

      // Fullscreen
      btnFs.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      });

      // ESC → bascule vers l'interface à onglets
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.location.href = 'madameglitch_unified.html';
        }
      });

      // Resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
      });

      // Animation loop
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value = clock.getElapsedTime();
        renderer.render(scene, camera);
      }

      loading.classList.add('hidden');
      animate();
    })();
  </script>
</body>
</html>
