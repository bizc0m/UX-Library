<!doctype html>
<!--
v1.0 2026-10-28 EXPÉRIMENTAL
DEMANDE: interface locale compacte (11 px, lignes 17 px) des tâches du jour, sobre, sans ressource distante
SORTIE: rendu par textContent uniquement, pont postMessage vers Swift, hauteur rapportée au panneau
PREUVE: lancement réel + capture, voir README
Fichier précédent: aucun
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Aucune ressource externe : tout est inline, aucune connexion autorisée. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<style>
  :root {
    --bg: #fbfbfa; --fg: #2e3135; --muted: #8b9097; --line: #e5e5e2;
    --accent: #3a78c9; --hover: #eef3fa;
    --p3: #cf4a3c; --p2: #dc7d2a; --p1: #c3a03a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--fg);
    font: 11px/17px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overflow: hidden; -webkit-user-select: none; cursor: default;
  }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; outline: none; }

  #head { flex: none; display: flex; align-items: center; height: 22px; padding: 0 4px 0 26px; }
  #head .title { font-weight: 600; }
  #date { flex: 1; min-width: 0; margin-left: 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 20px; height: 18px; line-height: 18px; color: var(--muted); border-radius: 3px; font-size: 12px; }
  .icon:hover { color: var(--accent); background: var(--hover); }

  #bar { flex: none; display: flex; gap: 3px; padding: 0 6px 4px; border-bottom: 1px solid var(--line); }
  #bar button { height: 17px; line-height: 15px; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; background: #fff; }
  #bar button:hover { border-color: #cfd6e0; }
  #bar button.on { color: var(--accent); border-color: #b9cde9; }

  #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .row { display: flex; align-items: center; height: 17px; line-height: 17px; padding: 0 2px 0 6px; }
  .row:hover { background: var(--hover); }
  .prio { flex: none; width: 18px; font-size: 10px; font-weight: 700; letter-spacing: -1px; }
  .p3 { color: var(--p3); } .p2 { color: var(--p2); } .p1 { color: var(--p1); }
  .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .lk { flex: none; width: 18px; height: 17px; line-height: 17px; text-align: center; color: var(--accent); border-radius: 3px; }
  .lk:hover { background: #dde7f5; }
  .lk.blocked { color: var(--muted); opacity: .5; cursor: not-allowed; }
  .lk.blocked:hover { background: none; }

  .msg { padding: 5px 8px; color: var(--muted); line-height: 15px; }
  .msg.err { color: #b0402f; }
  .msg .detail { font-size: 10px; }
  .msg .act { display: block; margin-top: 3px; color: var(--accent); }
  .msg .act:hover { text-decoration: underline; }

  #foot { flex: none; border-top: 1px solid var(--line); }
  #open { display: flex; width: 100%; height: 20px; line-height: 20px; padding: 0 2px 0 6px; color: var(--accent); text-align: left; }
  #open:hover { background: var(--hover); }
  #open:disabled { color: var(--muted); cursor: default; background: none; }
  #open .t { cursor: inherit; }
  #open .lk { background: none; color: inherit; }
</style>
</head>
<body>
  <div id="head">
    <span class="title">Aujourd’hui</span><span id="date"></span>
    <button id="refresh" class="icon" title="Actualiser">↻</button>
  </div>
  <div id="bar">
    <button id="day" class="on" title="Tâches de la note du jour">Jour</button>
    <button data-menu="projets">Projets ▾</button>
    <button data-menu="donnees">Données ▾</button>
    <button data-menu="liens">Liens ▾</button>
  </div>
  <div id="list"><div id="inner"></div></div>
  <div id="foot">
    <button id="open" disabled><span class="t">Ouvrir la note du jour dans NotePlan</span><span class="lk">↗</span></button>
  </div>
<script>
  "use strict";
  const post = (m) => window.webkit.messageHandlers.bridge.postMessage(m);
  const $ = (id) => document.getElementById(id);
  const PRIO = { 3: "!!!", 2: "!!", 1: "!" };
  const ACTIONS = { reselect: "Sélectionner à nouveau le dossier…", pickNote: "Sélectionner la note du jour…" };

  // Construction DOM par textContent uniquement : aucun contenu de note n'est interprété comme HTML.
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function reportHeight() {
    const h = $("head").offsetHeight + $("bar").offsetHeight + $("inner").offsetHeight + $("foot").offsetHeight;
    post({ type: "height", h });
  }

  window.render = function (d) {
    $("date").textContent = d.date || "";
    $("open").disabled = !d.canOpenNote;
    const inner = $("inner");
    inner.replaceChildren();

    if (d.state === "ok" && d.tasks.length) {
      d.tasks.forEach((t, i) => {
        const row = el("div", "row");
        row.appendChild(el("span", "prio p" + t.p, PRIO[t.p] || ""));
        const title = el("span", "t", t.t);
        title.title = t.tip;
        title.addEventListener("click", () => post({ type: "openTask", i }));
        row.appendChild(title);
        if (t.link !== "none") {
          const b = el("button", "lk" + (t.link === "blocked" ? " blocked" : ""), "↗");
          b.title = t.link === "blocked" ? "Lien non autorisé : " + t.url : t.url;
          if (t.link === "ok") b.addEventListener("click", (e) => { e.stopPropagation(); post({ type: "openLink", i }); });
          row.appendChild(b);
        }
        inner.appendChild(row);
      });
    } else {
      const err = d.state === "error" || d.state === "accessLost" || d.state === "ambiguous";
      const box = el("div", "msg" + (err ? " err" : ""));
      box.appendChild(el("div", "", d.message || ""));
      if (d.detail) box.appendChild(el("div", "detail", d.detail));
      if (d.action && ACTIONS[d.action]) {
        const a = el("button", "act", ACTIONS[d.action]);
        a.addEventListener("click", () => post({ type: d.action }));
        box.appendChild(a);
      }
      inner.appendChild(box);
    }
    requestAnimationFrame(reportHeight);
  };

  $("refresh").addEventListener("click", () => post({ type: "refresh" }));
  $("day").addEventListener("click", () => post({ type: "day" }));
  $("open").addEventListener("click", () => post({ type: "openDay" }));
  document.querySelectorAll("[data-menu]").forEach((b) => {
    b.addEventListener("click", () => {
      const r = b.getBoundingClientRect();
      post({ type: "menu", name: b.dataset.menu, x: r.left, y: r.bottom + 2 });
    });
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  post({ type: "ready" });
</script>
</body>
</html>
