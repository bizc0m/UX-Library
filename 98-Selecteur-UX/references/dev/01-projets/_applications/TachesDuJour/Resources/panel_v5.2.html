<!doctype html>
<!--
v5.2 2026-10-29 EXPÉRIMENTAL
DEMANDE: « pourquoi les #TAG #CONTEXT n'apparaissent pas ? et ne sont pas cliquables ? »
SORTIE: pastilles de tags / contextes (r.tags) après le titre, texte seul (textContent) ; clic → Swift (type tag, i, tag) ; pas d'ouverture de la tâche ni de glisser
PREUVE: navigateur (harnais), voir README
Fichier précédent: panel_v5.0.html

<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Aucune ressource externe : tout est inline, aucune connexion autorisée. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<style>
  :root {
    --bg: #fbfbfa; --fg: #2e3135; --muted: #8b9097; --line: #e5e5e2;
    --accent: #3a78c9; --hover: #eef3fa;
    --p3: #cf4a3c; --p2: #dc7d2a; --p1: #c3a03a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--fg);
    font: 11px/17px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overflow: hidden; -webkit-user-select: none; cursor: default;
  }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; outline: none; }

  #head { flex: none; display: flex; align-items: center; height: 24px; padding: 0 4px 0 22px; }
  #head .title { font-weight: 600; cursor: pointer; white-space: nowrap; }
  #head .title.today { color: var(--accent); }
  .nav { width: 16px; height: 16px; line-height: 15px; margin: 0 3px; color: #fff; background: #1f2226;
         border-radius: 3px; font-size: 13px; font-weight: 700; }
  .nav:hover { background: var(--accent); }
  #date { flex: 1; min-width: 0; margin-left: 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 24px; height: 22px; line-height: 22px; color: var(--muted); border-radius: 4px; font-size: 16px; }
  .icon:hover { color: var(--accent); background: var(--hover); }
  #lock[hidden] { display: none; }
  .tags { flex: 0 1 auto; display: flex; gap: 3px; min-width: 0; overflow: hidden; margin-left: 4px; }
  .tag { flex: none; height: 15px; line-height: 15px; padding: 0 5px; border-radius: 8px; font-size: 10px;
         color: #4a5563; background: #e8ecf2; cursor: pointer; white-space: nowrap; }
  .tag.ctx { color: #6b4e16; background: #f6ecd6; }
  .tag:hover { color: #fff; background: var(--accent); }
  #lock svg { width: 12px; height: 12px; vertical-align: -1px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  #lock.on { color: var(--accent); }

  #bar { display: none; }
  #head .icon { flex: none; }
  #head { border-bottom: 1px solid var(--line); }
  #menus { display: flex; min-width: 0; overflow: hidden; margin-left: 5px; }
  .mn { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; height: 17px; line-height: 15px; margin-left: 3px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px;
        background: #fff; font-size: 11px; white-space: nowrap; }
  .mn:hover { border-color: #cfd6e0; color: var(--accent); }

  #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  /* Barre fine visible dès que la liste dépasse (les barres macOS par défaut se cachent). */
  #list::-webkit-scrollbar { width: 8px; }
  #list::-webkit-scrollbar-track { background: transparent; }
  #list::-webkit-scrollbar-thumb { background: #c9ced6; border-radius: 4px; border: 2px solid var(--bg); }
  #list::-webkit-scrollbar-thumb:hover { background: #a9b0ba; }
  .row { display: flex; align-items: center; height: 17px; line-height: 17px; padding: 0 2px 0 6px; }
  .row:hover { background: var(--hover); }
  .prio { flex: none; width: 18px; font-size: 10px; font-weight: 700; letter-spacing: -1px; }
  .p3 { color: var(--p3); } .p2 { color: var(--p2); } .p1 { color: var(--p1); }
  .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .lk { flex: none; width: 18px; height: 17px; line-height: 17px; text-align: center; color: var(--accent); border-radius: 3px; }
  .lk:hover { background: #dde7f5; }
  .lk.blocked { color: var(--muted); opacity: .5; cursor: not-allowed; }
  .lk.blocked:hover { background: none; }
  /* Priorité : toute la ligne colorée. */
  .row.pr1 { background: #fdf1c2; } .row.pr2 { background: #fde0c3; } .row.pr3 { background: #fbd0cb; }
  .row.pr1:hover, .row.pr2:hover, .row.pr3:hover { filter: brightness(.96); }
  .row.sel { background: #dfe8f7; box-shadow: inset 2px 0 0 var(--accent); }
  .ed { flex: 1; min-width: 0; height: 15px; font: inherit; color: var(--fg); background: #fff; border: 1px solid #9fbbe3;
        border-radius: 3px; padding: 0 3px; outline: none; -webkit-user-select: text; }
  .row.dragging { opacity: .4; }
  .row.dropBefore { box-shadow: inset 0 2px 0 var(--accent); }
  .row.dropAfter { box-shadow: inset 0 -2px 0 var(--accent); }
  body.dnd, body.dnd * { cursor: grabbing !important; }
  .mv { flex: none; width: 18px; height: 17px; line-height: 17px; text-align: center; color: var(--muted); border-radius: 3px; opacity: 0; }
  /* Toujours visibles (le survol n'est pas détecté quand le panneau n'a pas le focus) ; pleines au survol / à la sélection. */
  .mv { opacity: .45 !important; }
  .row:hover .mv, .row.sel .mv { opacity: 1 !important; }
  .mv.back { width: 14px; margin-right: 1px; }
  .mv:hover { color: var(--accent); background: #dde7f5; }
  .tg { flex: none; width: 11px; color: var(--muted); font-size: 8px; cursor: pointer; text-align: center; }
  .tg:hover { color: var(--accent); }
  .box { flex: none; width: 9px; height: 9px; margin: 0 5px 0 1px; border: 1px solid #b4bac3; border-radius: 2px; cursor: pointer; }
  .box:hover { border-color: var(--accent); }
  .box.on { background: var(--accent); border-color: var(--accent); }
  .grp .t { color: #3f444b; font-weight: 700; }
  .par .t { font-weight: 700; }

  .msg { padding: 5px 8px; color: var(--muted); line-height: 15px; }
  .msg.err { color: #b0402f; }
  .msg .detail { font-size: 10px; }
  .msg .act { display: block; margin-top: 3px; color: var(--accent); }
  .msg .act:hover { text-decoration: underline; }

  #add { flex: none; height: 42px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-top: 1px solid #d9dde3; background: #eef1f5; }
  #addPlus { flex: none; width: 16px; color: var(--accent); font-size: 17px; font-weight: 400; text-align: center; cursor: text; }
  #addInput { flex: 1; min-width: 0; height: 24px; padding: 0 8px; font: inherit; color: var(--fg); background: transparent;
              border: 0; border-radius: 0; outline: none; -webkit-user-select: text; cursor: text; box-shadow: none; }
  #addInput::placeholder { color: #8b9097; }
  #add { position: relative; }
  #addHint { position: absolute; left: 0; right: 0; top: 0; bottom: 0; line-height: 42px; text-align: center; color: #8b9097;
             pointer-events: none; }
  #addHint.off { display: none; }
  #addPos { flex: none; max-width: 120px; height: 18px; line-height: 16px; padding: 0 8px; border: 1px solid var(--line); border-radius: 9px;
            background: #fff; color: #5b6068; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #addPos:hover { color: var(--accent); border-color: #b9cde9; }
  #addOk { flex: none; color: #3f8f52; font-size: 10px; opacity: 0; transition: opacity .2s; }
  #addOk.show { opacity: 1; }
  #foot { flex: none; border-top: 1px solid var(--line); }
  #open { display: flex; width: 100%; height: 20px; line-height: 20px; padding: 0 2px 0 6px; color: var(--accent); text-align: left; }
  #open:hover { background: var(--hover); }
  #open:disabled { color: var(--muted); cursor: default; background: none; }
  #open .t { cursor: inherit; }
  #open .lk { background: none; color: inherit; }
</style>
</head>
<body>
  <div id="head">
    <button id="prev" class="nav" title="Jour précédent">‹</button>
    <span id="title" class="title" title="Revenir à aujourd’hui">Aujourd’hui</span>
    <button id="next" class="nav" title="Jour suivant">›</button>
    <span id="menus"></span>
    <span id="date"></span>
    <button id="lock" class="icon" title="Bloquer la position du panneau" hidden></button>
    <button id="prefs" class="icon" title="Préférences">⚙</button>
    <button id="refresh" class="icon" title="Actualiser">↻</button>
  </div>
  <div id="bar"></div>
  <div id="list"><div id="inner"></div></div>
  <div id="add">
    <span id="addPlus">+</span>
    <span id="addHint">Ajouter une tâche</span>
    <input id="addInput" type="text" autocomplete="off" spellcheck="false" aria-label="Ajouter une tâche">
    <span id="addOk">✓ Ajoutée</span>
    <button id="addPos" title="Où ajouter la tâche">Fin de note ▾</button>
  </div>
  <div id="foot">
    <button id="open" disabled><span class="t" id="openLabel">Ouvrir la note du jour dans NotePlan</span><span class="lk">↗</span></button>
  </div>
<script>
  "use strict";
  const post = (m) => window.webkit.messageHandlers.bridge.postMessage(m);
  const $ = (id) => document.getElementById(id);
  const PRIO = { 3: "!!!", 2: "!!", 1: "!" };
  const ACTIONS = { reselect: "Sélectionner à nouveau le dossier…", pickNote: "Sélectionner la note du jour…" };

  // Construction DOM par textContent uniquement : aucun contenu de note n'est interprété comme HTML.
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function reportHeight() {
    const h = $("head").offsetHeight + $("bar").offsetHeight + $("inner").offsetHeight + $("add").offsetHeight + $("foot").offsetHeight;
    post({ type: "height", h });
  }

  let last = null;
  function toggle(key) {
    const f = new Set(last.folded || []);
    const now = !f.has(key);
    if (now) f.add(key); else f.delete(key);
    last.folded = [...f];
    post({ type: "fold", key, folded: now });
    window.render(last);
  }

  let followRaw = null, selLn = null, editing = false, pending = null, clickTimer = null, drag = null, justDragged = false;

  function clearDrop() {
    document.querySelectorAll(".dropBefore, .dropAfter, .dragging").forEach((x) => x.classList.remove("dropBefore", "dropAfter", "dragging"));
    document.body.classList.remove("dnd");
  }

  document.addEventListener("mousemove", (e) => {
    if (!drag) return;
    if (!drag.active) {
      if (Math.abs(e.clientY - drag.y) < 5) return;
      drag.active = true;
      post({ type: "log", msg: "glisser début ligne " + drag.r.ln });
      drag.row.classList.add("dragging");
      document.body.classList.add("dnd");
    }
    // Défilement automatique près des bords de la liste.
    const l = $("list"), lr = l.getBoundingClientRect();
    if (e.clientY < lr.top + 18) l.scrollTop -= 8; else if (e.clientY > lr.bottom - 18) l.scrollTop += 8;
    document.querySelectorAll(".dropBefore, .dropAfter").forEach((x) => x.classList.remove("dropBefore", "dropAfter"));
    const over = document.elementFromPoint(lr.left + 20, Math.min(Math.max(e.clientY, lr.top + 1), lr.bottom - 1));
    const tr = over && over.closest("#inner .row");
    if (!tr || tr === drag.row) { drag.target = null; return; }
    const b = tr.getBoundingClientRect();
    const after = e.clientY > b.top + b.height / 2;
    tr.classList.add(after ? "dropAfter" : "dropBefore");
    drag.target = { ln: Number(tr.dataset.ln), after };
  });

  document.addEventListener("mouseup", () => {
    if (!drag) return;
    const d = drag;
    drag = null;
    clearDrop();
    if (!d.active) return;
    post({ type: "log", msg: "lâcher cible=" + (d.target ? d.target.ln + (d.target.after ? " après" : " avant") : "aucune") });
    justDragged = true;
    setTimeout(() => { justDragged = false; }, 60);
    const t = d.target && rowsByLn.get(d.target.ln);
    if (t) post({ type: "move", i: d.r.id, target: t.r.id, after: d.target.after });
  });
  const rowsByLn = new Map();

  function markSel() {
    document.querySelectorAll("#inner .row").forEach((x) => x.classList.toggle("sel", Number(x.dataset.ln) === selLn));
  }

  // Édition en place : Entrée enregistre (Swift revérifie la ligne), Échap annule, sortie du champ = enregistrer.
  function startEdit(r, title) {
    if (editing || r.k !== "t") return;
    editing = true;
    const inp = document.createElement("input");
    inp.className = "ed";
    inp.value = r.raw || r.t;
    title.replaceWith(inp);
    inp.focus();
    inp.select();
    const done = (save) => {
      if (!editing) return;
      editing = false;
      const v = inp.value.trim();
      if (save && v && v !== (r.raw || r.t)) post({ type: "edit", i: r.id, text: v });
      const d = pending || last;
      pending = null;
      window.render(d);
    };
    inp.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter") { e.preventDefault(); done(true); }
      else if (e.key === "Escape") { e.preventDefault(); done(false); }
    });
    inp.addEventListener("blur", () => done(true));
  }

  window.render = function (d) {
    // Pas de rendu pendant une édition (rechargement du fichier) : appliqué à la sortie du champ.
    if (editing) { pending = d; return; }
    last = d;
    renderMenus(d.menus);
    renderLock(d.lock);
    // Après ⇧↑ / ⇧↓ : la sélection suit la ligne déplacée (son numéro a changé).
    if (followRaw !== null && d.rows) {
      const f = d.rows.find((r) => r.raw === followRaw || r.raw === followRaw.replace(/^[\t ]*/, ""));
      if (f) selLn = f.ln;
      followRaw = null;
    }
    $("date").textContent = "";
    // Champ d'ajout : seulement quand le dossier est lisible (note présente ou absente).
    $("add").style.display = d.state === "ok" || d.state === "noNote" ? "flex" : "none";
    $("addPos").textContent = (d.addLabel || "Fin de note") + " ▾";
    $("addPos").title = "Où ajouter la tâche : " + (d.addLabel || "Fin de note");
    // Date seule dans l'en-tête ; « Aujourd'hui / Hier / Demain… » en infobulle.
    const label = d.date ? d.date.charAt(0).toUpperCase() + d.date.slice(1) : (d.title || "Aujourd’hui");
    $("title").textContent = label;
    $("title").classList.toggle("today", d.offset === 0);
    $("title").title = (d.title || "") + (d.offset === 0 ? "" : " — clic : revenir à aujourd’hui");
    $("openLabel").textContent = d.offset === 0 ? "Ouvrir la note du jour dans NotePlan" : "Ouvrir cette note dans NotePlan";
    $("open").disabled = !d.canOpenNote;
    const inner = $("inner");
    inner.replaceChildren();
    rowsByLn.clear();

    if (d.state === "ok" && d.rows.length) {
      const folded = new Set(d.folded || []);
      const anyKids = d.rows.some((r) => r.kids);
      let hideBelow = null;
      d.rows.forEach((r) => {
        // Descendants d'un nœud plié : masqués jusqu'au retour à sa profondeur.
        if (hideBelow !== null && r.d > hideBelow) return;
        hideBelow = null;
        const isFolded = r.kids && folded.has(r.key);
        const row = el("div", "row" + (r.k === "g" ? " grp" : "") + (r.kids ? " par" : "") + (r.k === "t" && r.p ? " pr" + r.p : "") + (r.ln === selLn ? " sel" : ""));
        row.dataset.ln = r.ln;
        row.addEventListener("mousedown", (e) => {
          selLn = r.ln; markSel();
          // Glisser-déposer : pas depuis une case, un bouton ou un champ.
          if (e.button === 0 && !e.target.closest(".box, button, input, .tg")) drag = { r, row, y: e.clientY, active: false, target: null };
        });
        row.style.paddingLeft = (6 + r.d * 12) + "px";
        if (anyKids) {
          const tg = el("span", "tg", r.kids ? (isFolded ? "▸" : "▾") : "");
          if (r.kids) tg.addEventListener("click", (e) => { e.stopPropagation(); toggle(r.key); });
          row.appendChild(tg);
        }
        if (r.k === "t") {
          // Ramener au jour d'avant : seulement sur un jour futur (jamais avant aujourd'hui).
          if (d.offset > 0) {
            const back = el("button", "mv back", "←");
            back.title = d.offset === 1 ? "Ramener à aujourd’hui" : "Ramener au jour d’avant";
            back.addEventListener("click", (e) => { e.stopPropagation(); post({ type: "reschedule", i: r.id, delta: -1 }); });
            row.appendChild(back);
          }
          const box = el("span", "box");
          box.title = "Cocher dans la note";
          box.addEventListener("click", (e) => {
            e.stopPropagation();
            if (box.classList.contains("on")) return;
            box.classList.add("on");
            post({ type: "complete", i: r.id });
          });
          row.appendChild(box);
          row.appendChild(el("span", "prio p" + r.p, PRIO[r.p] || ""));
        }
        const title = el("span", "t");
        title.appendChild(el("span", r.k === "t" && r.p ? "hl" : "", r.t));
        title.title = r.tip;
        if (r.k === "g") title.addEventListener("click", () => toggle(r.key));
        else {
          // Clic simple différé : un double-clic doit éditer sans ouvrir NotePlan.
          title.addEventListener("click", () => {
            if (justDragged) return;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => post({ type: "openTask", i: r.id }), 280);
          });
          title.addEventListener("dblclick", (e) => { e.preventDefault(); clearTimeout(clickTimer); startEdit(r, title); });
        }
        rowsByLn.set(r.ln, { r, title });
        row.appendChild(title);
        if (r.k === "t" && r.tags && r.tags.length) {
          const tags = el("span", "tags");
          r.tags.forEach((t) => {
            const c = el("span", t.startsWith("@") ? "tag ctx" : "tag", t);
            c.title = "Rechercher " + t + " dans NotePlan";
            c.addEventListener("mousedown", (e) => e.stopPropagation());
            c.addEventListener("click", (e) => { e.stopPropagation(); post({ type: "tag", i: r.id, tag: t }); });
            tags.appendChild(c);
          });
          row.appendChild(tags);
        }
        if (r.k === "t") {
          const mv = el("button", "mv", "→");
          mv.title = "Reporter à demain";
          mv.addEventListener("click", (e) => { e.stopPropagation(); post({ type: "reschedule", i: r.id, delta: 1 }); });
          row.appendChild(mv);
        }
        if (r.link !== "none") {
          const b = el("button", "lk" + (r.link === "blocked" ? " blocked" : ""), "↗");
          b.title = r.link === "blocked" ? "Lien non autorisé : " + r.url : r.url;
          if (r.link === "ok") b.addEventListener("click", (e) => { e.stopPropagation(); post({ type: "openLink", i: r.id }); });
          row.appendChild(b);
        }
        inner.appendChild(row);
        if (isFolded) hideBelow = r.d;
      });
    } else {
      const err = d.state === "error" || d.state === "accessLost" || d.state === "ambiguous";
      const box = el("div", "msg" + (err ? " err" : ""));
      box.appendChild(el("div", "", d.message || ""));
      if (d.detail) box.appendChild(el("div", "detail", d.detail));
      if (d.action && ACTIONS[d.action]) {
        const a = el("button", "act", ACTIONS[d.action]);
        a.addEventListener("click", () => post({ type: d.action }));
        box.appendChild(a);
      }
      inner.appendChild(box);
    }
    requestAnimationFrame(reportHeight);
  };

  $("addInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing) {
      e.preventDefault();
      const v = e.target.value.trim();
      if (v) {
        post({ type: "addInline", text: v });
        e.target.value = "";
        syncHint();
        $("addOk").classList.add("show");
        setTimeout(() => $("addOk").classList.remove("show"), 1400);
      }
    } else if (e.key === "Escape") {
      e.target.value = "";
      syncHint();
      e.target.blur();
    }
  });
  // Invite centrée sur tout le panneau : visible seulement quand le champ est vide.
  function syncHint() { $("addHint").classList.toggle("off", $("addInput").value !== ""); }
  $("addInput").addEventListener("input", syncHint);
  $("addPlus").addEventListener("click", () => $("addInput").focus());
  $("addPos").addEventListener("click", () => {
    const r = $("addPos").getBoundingClientRect();
    post({ type: "addPosMenu", x: r.left, y: r.bottom + 2 });
  });
  $("prev").addEventListener("click", () => post({ type: "shiftDay", delta: -1 }));
  $("next").addEventListener("click", () => post({ type: "shiftDay", delta: 1 }));
  $("title").addEventListener("click", () => post({ type: "today" }));
  $("prefs").addEventListener("click", () => post({ type: "prefs" }));
  $("lock").addEventListener("click", () => post({ type: "lock" }));

  // Cadenas : dessiné en SVG (pas d'emoji coloré) ; anse fermée si bloqué, ouverte sinon.
  let lockKey = null;
  function renderLock(state) {
    const b = $("lock");
    const key = String(state);
    if (key === lockKey) return;
    lockKey = key;
    b.hidden = state !== true && state !== false;
    if (b.hidden) return;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 12 12");
    const body = document.createElementNS(ns, "rect");
    for (const [k, v] of [["x", "2"], ["y", "5.5"], ["width", "8"], ["height", "5.5"], ["rx", "1.2"]]) body.setAttribute(k, v);
    const shackle = document.createElementNS(ns, "path");
    shackle.setAttribute("d", state ? "M4 5.5V3.8a2 2 0 0 1 4 0v1.7" : "M4 5.5V3.8a2 2 0 0 1 4 0");
    svg.append(body, shackle);
    b.replaceChildren(svg);
    b.classList.toggle("on", state);
    b.title = state ? "Position bloquée — cliquer pour débloquer" : "Bloquer la position du panneau";
  }
  $("refresh").addEventListener("click", () => post({ type: "refresh" }));
  $("open").addEventListener("click", () => post({ type: "openDay" }));
  // Menus de l'en-tête : construits à chaque rendu depuis la liste choisie dans les préférences.
  let menusKey = null;
  function renderMenus(names) {
    const key = JSON.stringify(names || []);
    if (key === menusKey) return;
    menusKey = key;
    const box = $("menus");
    box.replaceChildren();
    (names || []).forEach((n, i) => {
      const b = el("button", "mn", n + " ▾");
      b.title = n;
      b.addEventListener("click", () => {
        const r = b.getBoundingClientRect();
        post({ type: "menu", index: i, x: r.left, y: r.bottom + 2 });
      });
      box.appendChild(b);
    });
  }
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // Molette / trackpad n'importe où dans le panneau → défilement de la liste.
  document.addEventListener("wheel", (e) => {
    const l = $("list");
    if (l.scrollHeight <= l.clientHeight) return;
    l.scrollTop += e.deltaMode === 1 ? e.deltaY * 17 : e.deltaY;
    e.preventDefault();
  }, { passive: false });

  // Flèches ↑ ↓ : sélection de ligne ; Entrée : éditer (tâche) ou plier (groupe) ; Échap : désélectionner.
  document.addEventListener("keydown", (e) => {
    if (editing || e.target.tagName === "INPUT") return;
    const vis = [...document.querySelectorAll("#inner .row")];
    if (!vis.length) return;
    let idx = vis.findIndex((x) => Number(x.dataset.ln) === selLn);
    if (e.key === "Tab") {
      // Tab : sous-tâche (un niveau de plus) ; ⇧Tab : remonter d'un niveau.
      e.preventDefault();
      const it = rowsByLn.get(selLn);
      if (it) post({ type: "indent", i: it.r.id, delta: e.shiftKey ? -1 : 1 });
      return;
    }
    if (e.shiftKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
      // ⇧↑ / ⇧↓ : échange avec la ligne sœur (même niveau, même parent).
      e.preventDefault();
      const it = rowsByLn.get(selLn);
      if (!it || !last || !last.rows) return;
      const rows = last.rows, cur = rows.findIndex((x) => x.id === it.r.id), up = e.key === "ArrowUp";
      let t = null;
      for (let k = cur + (up ? -1 : 1); k >= 0 && k < rows.length; k += up ? -1 : 1) {
        if (rows[k].d < it.r.d) break;
        if (rows[k].d === it.r.d) { t = rows[k]; break; }
      }
      if (!t) return;
      followRaw = it.r.raw;
      post({ type: "move", i: it.r.id, target: t.id, after: !up });
      return;
    }
    if (e.key === "ArrowDown") idx = Math.min(vis.length - 1, idx + 1);
    else if (e.key === "ArrowUp") idx = idx < 0 ? 0 : Math.max(0, idx - 1);
    else if (e.key === "Enter" && idx >= 0) {
      e.preventDefault();
      const it = rowsByLn.get(selLn);
      if (it && it.r.k === "g") toggle(it.r.key); else if (it) startEdit(it.r, it.title);
      return;
    } else if (e.key === "Escape") { selLn = null; markSel(); return; }
    else return;
    e.preventDefault();
    selLn = Number(vis[idx].dataset.ln);
    markSel();
    vis[idx].scrollIntoView({ block: "nearest" });
  });
  post({ type: "ready" });
</script>
</body>
</html>
