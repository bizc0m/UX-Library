const $=id=>document.getElementById(id), app=$("app"), lang=$("lang");
function tx(){return T[S.lang]||T.fr} function dim(){return D[S.lang]||D.fr} function prof(){return P[S.lang]||P.en} function qs(){return Q[S.lang]||Q.fr}
function e(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function go(r){S.route=r;location.hash=r;render()}function persist(){localStorage.vibeI=S.i;localStorage.vibeAns=JSON.stringify(S.ans)}function reset(){S.i=0;S.ans=[];delete localStorage.vibeI;delete localStorage.vibeAns}
function score(){let sc={V:0,I:0,B:0,E:0};S.ans.forEach(x=>sc[x]++);let total=Math.max(S.ans.length,1),sorted=KEYS.map(k=>({k,v:sc[k],pct:Math.round(sc[k]/total*100)})).sort((a,b)=>b.v-a.v||KEYS.indexOf(a.k)-KEYS.indexOf(b.k));return{sc,total,sorted,primary:sorted[0].k,secondary:sorted.find(x=>x.k!==sorted[0].k).k,key:sorted[0].k+sorted.find(x=>x.k!==sorted[0].k).k,date:new Date().toISOString()}}
function final(){S.result=score();localStorage.vibeResult=JSON.stringify(S.result);reset();go("result")}
function vibeCards(){let d=dim();return KEYS.map(k=>`<div class="letter"><b>${k}</b><span>${e(d[k][0])}</span><small class="small">${e(d[k][1])}</small></div>`).join("")}
function bars(r){let d=dim();return r.sorted.map((x,i)=>`<div><div class="bar-head"><span>${e(d[x.k][0])}${i==0?" · "+tx().primary:i==1?" · "+tx().secondary:""}</span><span>${x.pct}%</span></div><div class="track"><div class="fill" style="--w:${x.pct}%"></div></div></div>`).join("")}
function tiers(){let t=tx();return t.tiers.map((x,i)=>`<div class="card ${i?"locked":""}"><div style="display:flex;justify-content:space-between;gap:12px"><div><div class="eyebrow">Tier ${i+1}</div><h3>${e(x)}</h3></div><span class="tag ${i?"lock":"open"}">${i?"Locked":"Open"}</span></div><ul><li>${i==0?t.breakdown:"Profile logic"}</li><li>${i==2?"Personal operating system":"Decision style"}</li><li>${i==2?"Collaboration map":"Strengths and blind spots"}</li></ul></div>`).join("")}
function home(){let t=tx();return `<section class="hero"><div class="wrap grid two"><div><div class="eyebrow">VIBE Assessment</div><h1>${e(t.homeTitle)}</h1><p class="lead">${e(t.homeSub)}</p><div class="chips"><span class="chip">8 min</span><span class="chip">Free</span><span class="chip">No account</span></div><div style="margin-top:26px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn gold" data-route="intro">${e(t.cta)}</button><button class="btn" data-route="signin">${e(t.signin)}</button></div><p class="small" style="margin-top:18px">${e(t.meta)}</p></div><div class="panel"><div class="vibe">${vibeCards()}</div><p class="center">12 operating profiles · V/I/B/E combinations</p></div></div></section><section><div class="wrap grid two"><div class="panel"><div class="eyebrow">System</div><h2>${e(t.diff)}</h2><p>${e(t.diffBody)}</p></div><div class="panel"><h2>${e(t.system)}</h2><p>${e(t.systemBody)}</p></div></div></section><section><div class="wrap center"><div class="eyebrow">Unlock</div><h2>${e(t.tiers[0])} → ${e(t.tiers[2])}</h2><div class="grid three" style="margin-top:26px">${tiers()}</div></div></section>`}
function intro(){let t=tx();return `<section class="hero"><div class="wrap grid two"><div><div class="eyebrow">VIBE Assessment</div><h1>${e(t.introTitle)}</h1><p class="lead">${e(t.introBody)}</p><div class="steps">${t.steps.map((x,i)=>`<div class="step"><div class="num">${i+1}</div><p>${e(x)}</p></div>`).join("")}</div><button class="btn gold" id="begin">${e(t.cta)}</button></div><div class="panel"><div class="vibe">${vibeCards()}</div><div class="notice">${e(t.local)}</div></div></div></section>`}
function assess(){let t=tx(),qq=qs();if(S.i>=qq.length)return result();let q=qq[S.i],pct=Math.round(S.i/qq.length*100);return `<section><div class="wrap"><div style="display:flex;justify-content:space-between;gap:18px;align-items:center"><div><div class="eyebrow">${e(t.question)} ${S.i+1} ${e(t.of)} ${qq.length}</div><p class="small">${e(t.introBody)}</p></div><button class="btn" id="reset">${e(t.restart)}</button></div><div class="progress"><div style="width:${pct}%"></div></div><div class="panel" style="margin-top:24px"><h2 class="qtitle">${e(q[0])}</h2><div class="choices">${q[1].map((o,i)=>`<button class="choice" data-a="${KEYS[i]}"><i>${String.fromCharCode(65+i)}</i><span>${e(o)}</span></button>`).join("")}</div></div></div></section>`}
function result(){let t=tx(),r=S.result||score(),d=dim(),name=prof()[r.key]||`${d[r.primary][0]} · ${d[r.secondary][0]}`;return `<section><div class="wrap result-layout"><div class="panel"><div class="eyebrow">${e(t.result)}</div><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="ring">${Math.round(r.sc[r.primary]/Math.max(r.total,1)*100)}%</div><div><h1 style="font-size:clamp(42px,6vw,78px);margin-bottom:8px">${e(name)}</h1><p class="lead">${e(d[r.primary][0])} · ${e(d[r.secondary][0])}</p></div></div><p>${e(d[r.primary][1])}. ${e(d[r.secondary][1])}. ${e(d[r.primary][2])}; ${e(d[r.secondary][2])}.</p><div class="divider"></div><div class="grid two"><div><h3>${e(t.strengths)}</h3><ul><li>${e(d[r.primary][2])}</li><li>${e(d[r.secondary][2])}</li></ul></div><div><h3>${e(t.shadow)}</h3><p>${e(d[r.primary][3])}</p></div><div><h3>${e(t.win)}</h3><p>${e(d[r.primary][2])}; ${e(d[r.secondary][2])}.</p></div><div><h3>${e(t.need)}</h3><p>${e(d[r.primary][4])}; ${e(d[r.secondary][4])}.</p></div></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px"><button class="btn gold" data-route="dashboard">${e(t.dashboard)}</button><button class="btn" id="retake">${e(t.retake)}</button></div></div><div class="panel"><h3>${e(t.breakdown)}</h3><div class="bars">${bars(r)}</div><div class="notice">${e(t.saveHint)}</div><button class="btn block" data-route="signin">${e(t.signin)}</button></div></div></section><section><div class="wrap grid three">${tiers()}</div></section>`}
function signin(){let t=tx();return `<section class="hero"><div class="wrap"><div class="panel signin"><div class="eyebrow">${e(t.signin)}</div><h1 style="font-size:clamp(42px,6vw,74px)">${e(t.signin)}</h1><p>${e(t.local)}</p><form id="form"><div class="field"><label>${e(t.email)}</label><input id="email" type="email" required placeholder="you@example.com" value="${e(S.user?.email||"")}"></div><div class="field"><label>${e(t.password)}</label><input type="password" placeholder="••••••••"></div><button class="btn gold block">${e(t.enter)}</button></form></div></div></section>`}
function dash(){let t=tx();if(!S.result)return `<section class="hero"><div class="wrap center panel"><h1>${e(t.dashboard)}</h1><p class="lead">No saved result.</p><button class="btn gold" data-route="intro">${e(t.cta)}</button></div></section>`;return `<section class="hero"><div class="wrap"><div class="eyebrow">${e(S.user?.email||t.local)}</div><h1>${e(t.dashboard)}</h1></div></section>${result()}`}
function bind(){document.querySelectorAll("[data-route]").forEach(x=>x.onclick=()=>go(x.dataset.route));$("begin")&&($("begin").onclick=()=>{reset();go("assessment")});$("reset")&&($("reset").onclick=()=>{reset();go("assessment")});$("retake")&&($("retake").onclick=()=>{S.result=null;delete localStorage.vibeResult;reset();go("assessment")});document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{S.ans[S.i]=b.dataset.a;S.i++;persist();S.i>=qs().length?final():render()});$("form")&&($("form").onsubmit=e=>{e.preventDefault();S.user={email:$("email").value,date:new Date().toISOString()};localStorage.vibeUser=JSON.stringify(S.user);go("dashboard")})}
function render(){let t=tx();document.documentElement.lang=S.lang;document.title=t.homeTitle+" — VIBE";$("signinBtn").textContent=S.user?t.dashboard:t.signin;$("signinBtn").dataset.route=S.user?"dashboard":"signin";$("startBtn").textContent=t.start;$("foot").textContent=t.foot;app.innerHTML=S.route=="intro"?intro():S.route=="assessment"?assess():S.route=="result"?result():S.route=="signin"?signin():S.route=="dashboard"?dash():home();bind()}
lang.innerHTML=Object.keys(T).map(k=>`<option value="${k}">${T[k].language}</option>`).join("");lang.value=S.lang;lang.onchange=e=>{S.lang=e.target.value;localStorage.vibeLang=S.lang;render()};window.onhashchange=()=>{S.route=location.hash.slice(1)||"home";render()};render();
