<!doctype html>
<!--
Projet : Night Intel V6 - Nightlife Radar
Base sur / inspire par :
- Leaflet / Leaflet : https://github.com/Leaflet/Leaflet
- bmcbride / geojson-share-maps : https://github.com/bmcbride/geojson-share-maps
- City-of-Helsinki / LinkedEvents : https://github.com/City-of-Helsinki/linkedevents
Merci aux auteurs et mainteneurs de ces projets open source.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Intel</title>
  <style>
    :root {
      --ink: #07070b;
      --panel: rgba(15, 15, 22, 0.72);
      --bone: #f5f0e4;
      --muted: #7a7589;
      --pink: #ff2d6f;
      --pink-glow: #ff6fa3;
      --electric: #5bcfff;
      --acid: #c2ff3d;
      --amber: #ffb13d;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: var(--bone);
      font-family: Inter, Manrope, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 34%, rgba(255, 45, 111, 0.18), transparent 30%),
        radial-gradient(circle at 70% 58%, rgba(91, 207, 255, 0.12), transparent 28%),
        linear-gradient(180deg, #110514 0%, #07070b 58%, #050508 100%);
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .entry-ui {
      position: relative;
      z-index: 2;
      width: min(980px, calc(100vw - 32px));
      min-height: min(720px, calc(100vh - 32px));
      display: grid;
      grid-template-rows: auto 1fr auto;
      pointer-events: none;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 45, 111, 0.22);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 24px 90px -60px var(--pink);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 950;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .mark {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 50%, var(--pink) 0 48%, transparent 49%),
                  radial-gradient(circle at 56% 37%, var(--ink) 0 39%, transparent 40%);
      box-shadow: 0 0 28px -4px var(--pink);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--acid);
      box-shadow: 0 0 16px var(--acid);
      animation: pulse 1.8s ease-in-out infinite;
    }
    .center {
      align-self: center;
      justify-self: center;
      text-align: center;
      transform: translateY(132px);
    }
    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 92px);
      line-height: 0.92;
      font-weight: 950;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 0 0 38px rgba(255, 45, 111, 0.28);
    }
    .subtitle {
      margin: 16px auto 0;
      max-width: 720px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(12px, 1.4vw, 15px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
      pointer-events: auto;
      flex-wrap: wrap;
    }
    .btn {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      color: var(--bone);
      background: rgba(255,255,255,0.07);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 900;
    }
    .btn.primary {
      border: none;
      color: #07070b;
      background: linear-gradient(90deg, var(--pink), var(--pink-glow));
      box-shadow: 0 0 44px -14px var(--pink);
    }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .cities {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .city {
      padding: 7px 10px;
      border: 1px solid rgba(180, 123, 255, 0.28);
      border-radius: 999px;
      background: rgba(92,38,130,0.20);
      color: var(--bone);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.72); }
    }
    @media (max-width: 720px) {
      .entry-ui { min-height: calc(100vh - 24px); }
      .top, .bottom { align-items: flex-start; flex-direction: column; }
      .center { transform: translateY(92px); }
      .cities { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <canvas id="globe" aria-label="Rotating Night Intel 3D globe"></canvas>
  <main class="entry-ui">
    <header class="top">
      <div class="brand"><span class="mark"></span> Night Intel Network</div>
      <div class="status"><span class="dot"></span> live globe entry</div>
    </header>
    <section class="center">
      <h1>Night Intel<br>Globe</h1>
      <p class="subtitle">Enter the nightlife intelligence network</p>
      <div class="actions">
        <a class="btn primary" href="/">Enter Night Intel</a>
        <a class="btn" href="/world-radar">Open World Radar</a>
      </div>
    </section>
    <footer class="bottom">
      <span>Dev in #Ibiza · brains from #Annecy · from #Geneva</span>
      <div class="cities">
        <span class="city">Annecy</span>
        <span class="city">Genève</span>
        <span class="city">Ibiza</span>
        <span class="city">Seoul</span>
      </div>
    </footer>
  </main>
  <script>
    const canvas = document.getElementById("globe");
    const ctx = canvas.getContext("2d");
    const points = [
      { name: "Annecy", lat: 45.9, lon: 6.1, color: "#5bcfff" },
      { name: "Geneva", lat: 46.2, lon: 6.1, color: "#c2ff3d" },
      { name: "Ibiza", lat: 38.9, lon: 1.4, color: "#ff2d6f" },
      { name: "Seoul", lat: 37.5, lon: 127.0, color: "#ffb13d" },
      { name: "Tokyo", lat: 35.7, lon: 139.7, color: "#b47bff" },
      { name: "New York", lat: 40.7, lon: -74.0, color: "#5bcfff" },
      { name: "Berlin", lat: 52.5, lon: 13.4, color: "#ff2d6f" },
      { name: "Barcelona", lat: 41.4, lon: 2.2, color: "#c2ff3d" }
    ];
    const connections = [[0,1], [0,2], [2,6], [6,5], [3,4], [2,3], [1,6]];
    let w = 0;
    let h = 0;
    let dpr = 1;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function project(lat, lon, rot, radius) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + rot) * Math.PI / 180;
      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      return { x: w / 2 + x, y: h / 2 + y * 0.92, z };
    }
    function draw(t) {
      const time = t * 0.001;
      const radius = Math.min(w, h) * 0.245;
      const rot = time * 14;
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 90; i++) {
        const x = (Math.sin(i * 47.3) * 0.5 + 0.5) * w;
        const y = (Math.sin(i * 19.7 + 2) * 0.5 + 0.5) * h;
        ctx.fillStyle = i % 5 === 0 ? "rgba(255,45,111,.42)" : "rgba(91,207,255,.20)";
        ctx.beginPath();
        ctx.arc(x, y, i % 5 === 0 ? 1.5 : 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      const cx = w / 2;
      const cy = h / 2;
      const glow = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius * 1.25);
      glow.addColorStop(0, "rgba(255,45,111,.25)");
      glow.addColorStop(0.52, "rgba(91,207,255,.10)");
      glow.addColorStop(1, "rgba(255,45,111,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 1.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.10)";
      ctx.lineWidth = 1;
      for (let lat = -60; lat <= 60; lat += 30) {
        ctx.beginPath();
        for (let lon = -180; lon <= 180; lon += 4) {
          const p = project(lat, lon, rot, radius);
          if (p.z < -radius * 0.08) continue;
          if (lon === -180) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
      }
      for (let lon = -150; lon <= 180; lon += 30) {
        ctx.beginPath();
        for (let lat = -80; lat <= 80; lat += 3) {
          const p = project(lat, lon, rot, radius);
          if (p.z < -radius * 0.08) continue;
          if (lat === -80) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
      }
      const projected = points.map((p) => ({ ...p, pos: project(p.lat, p.lon, rot, radius) }));
      ctx.lineWidth = 1.3;
      connections.forEach(([a, b], index) => {
        const pa = projected[a].pos;
        const pb = projected[b].pos;
        if (pa.z < 0 || pb.z < 0) return;
        const pulse = (Math.sin(time * 2.6 + index) + 1) / 2;
        ctx.strokeStyle = `rgba(255,45,111,${0.18 + pulse * 0.32})`;
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        const mx = (pa.x + pb.x) / 2;
        const my = (pa.y + pb.y) / 2 - radius * 0.22;
        ctx.quadraticCurveTo(mx, my, pb.x, pb.y);
        ctx.stroke();
      });
      projected.sort((a, b) => a.pos.z - b.pos.z).forEach((p, index) => {
        const visible = p.pos.z > -radius * 0.05;
        if (!visible) return;
        const alpha = 0.42 + Math.max(0, p.pos.z / radius) * 0.58;
        const size = 4 + Math.max(0, p.pos.z / radius) * 4;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.pos.x, p.pos.y, size + Math.sin(time * 3 + index) * 1.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = alpha * 0.24;
        ctx.beginPath();
        ctx.arc(p.pos.x, p.pos.y, size * 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
      ctx.strokeStyle = "rgba(255,45,111,.55)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.stroke();
      requestAnimationFrame(draw);
    }
    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
